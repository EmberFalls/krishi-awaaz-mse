services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: krishi_awaaz
      POSTGRES_USER: krishi
      POSTGRES_PASSWORD: krishi
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi -d krishi_awaaz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - krishi_postgres_data:/var/lib/postgresql

volumes:
  krishi_postgres_data:
